<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Beleza Natural - Produtos para Cabelos</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <header>
    <h1>Beleza Natural</h1>
    <nav>
      <ul>
        <li><a href="#">Início</a></li>
        <li><a href="#">Produtos</a></li>
        <li><a href="#">Contato</a></li>
        <li><a href="#" id="carrinho">Carrinho (0)</a></li>
      </ul>
    </nav>
  </header>

  <main>
    <section class="produtos">
      <div class="produto">
        <img src="https://via.placeholder.com/200x200?text=Shampoo" alt="Shampoo" />
        <h3>Shampoo Nutritivo</h3>
        <p>R$ 29,90</p>
        <button onclick="adicionarCarrinho('Shampoo Nutritivo')">Adicionar ao carrinho</button>
      </div>

      <div class="produto">
        <img src="https://via.placeholder.com/200x200?text=Condicionador" alt="Condicionador" />
        <h3>Condicionador Hidratante</h3>
        <p>R$ 34,90</p>
        <button onclick="adicionarCarrinho('Condicionador Hidratante')">Adicionar ao carrinho</button>
      </div>

      <div class="produto">
        <img src="https://via.placeholder.com/200x200?text=Máscara" alt="Máscara Capilar" />
        <h3>Máscara de Hidratação</h3>
        <p>R$ 49,90</p>
        <button onclick="adicionarCarrinho('Máscara de Hidratação')">Adicionar ao carrinho</button>
      </div>
    </section>
  </main>

  <footer>
    <p>&copy; 2025 Beleza Natural. Todos os direitos reservados.</p>
  </footer>

  <script src="script.js"></script>
</body>
</html>
body {
  font-family: Arial, sans-serif;
  margin: 0;
  padding: 0;
}

header {
  background-color: #ff69b4;
  color: white;
  padding: 20px;
  text-align: center;
}

nav ul {
  list-style: none;
  display: flex;
  justify-content: center;
  padding: 0;
}

nav ul li {
  margin: 0 15px;
}

nav ul li a {
  color: white;
  text-decoration: none;
  font-weight: bold;
}

.produtos {
  display: flex;
  flex-wrap: wrap;
  justify-content: center;
  margin: 30px;
}

.produto {
  border: 1px solid #ccc;
  padding: 15px;
  margin: 10px;
  text-align: center;
  width: 200px;
}

.produto img {
  max-width: 100%;
}

button {
  background-color: #ff69b4;
  color: white;
  border: none;
  padding: 10px;
  cursor: pointer;
}

button:hover {
  background-color: #ff1493;
}

footer {
  background-color: #f2f2f2;
  text-align: center;
  padding: 15px;
  margin-top: 40px;
}
let carrinhoContador = 0;

function adicionarCarrinho(produto) {
  carrinhoContador++;
  alert(produto + " adicionado ao carrinho!");
  document.getElementById("carrinho").textContent = `Carrinho (${carrinhoContador})`;
}
